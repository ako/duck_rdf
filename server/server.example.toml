# /config/server.toml for the DuckDB + rdf server image.
# Every section is optional; with no file the server just exposes /data.

[server]
# Clients need this token: ATTACH 'quack:host:9443' AS db (TOKEN '...').
# Prefer the QUACK_TOKEN environment variable over writing it here.
# token = "change-me"
# Restrict file access to /data and /config, and freeze all settings.
lock_down = true

[duckdb]
# threads = 4
# memory_limit = "4GB"

[data]
directory = "/data"
# Expose what is mounted under /data automatically:
#   name.parquet or a directory of Parquet files -> view `name`
#   a directory with metadata/ (an Iceberg table)  -> view `name`
#   name.sqlite / .sqlite3 / .db                    -> attached database `name`
#   name.duckdb                                     -> attached database `name`
auto_discover = true
# Also give every table of an attached database a plain view of the same name,
# so a mapping can refer to `emp` instead of `hr.emp`.
expose_attached_tables = true

[rdf]
# The default mapping: clients then call sparql('SELECT ...') instead of
# execute_sparql('SELECT ...', '/config/mapping.ttl'). A glob merges files.
mapping = "/config/mapping/*.ttl"
# Answer queries under the ontology's class and property hierarchies.
ontology = "/config/ontology/*.ttl"
# Return SELECT columns as native SQL types where the mapping settles them.
typed_results = true

# Views written by hand, for anything auto-discovery does not cover.
# [[views]]
# name = "orders"
# sql = "SELECT * FROM read_parquet('/data/sales/**/*.parquet', hive_partitioning = true)"

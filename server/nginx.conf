# TLS in front of Quack. DuckDB recommends keeping the Quack endpoint on
# localhost and reverse-proxying it rather than exposing it directly.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    client_max_body_size 64m;

    upstream quack { server 127.0.0.1:9494; keepalive 16; }

    server {
        listen 9443 ssl;
        ssl_certificate     /tmp/tls/cert.pem;
        ssl_certificate_key /tmp/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://quack;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}

source_clusters:
  - name: local
tables:
  - source_cluster_name: local
    source_topic: orders
    source_format: json
    schema_mode: inline
    input_schema: |
      {"type": "object", "properties": {
        "id": {"type": "integer"}, "customer": {"type": "string"}, "amount": {"type": "number"},
        "placed": {"type": "string", "format": "date-time"},
        "lines": {"type": "array", "items": {"type": "object", "properties": {"sku": {"type": "string"}, "qty": {"type": "integer"}}}}}}
    partitioning_scheme: day
